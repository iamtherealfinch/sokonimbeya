<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Dashboard - OnlineSoko Mbeya</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background: #eef2f5; }
    h1 { color: #1b5e20; font-size: 20px; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    .panel { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 320px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
    input, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 4px; border: 1px solid #ccc; }
    button { background: #1b5e20; color: white; border: none; font-weight: bold; cursor: pointer; }
    .order-card { background: #fff; border-left: 5px solid #2e7d32; padding: 12px; margin-bottom: 15px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .order-map { height: 180px; width: 100%; border-radius: 6px; margin: 8px 0; border: 1px solid #ccc; }
    .p-item { background: #f9f9f9; border: 1px solid #eee; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .p-img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    .badge-offer { background: #e65100; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
  </style>
</head>
<body>

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1>🛠️ Admin & Vendor Panel (OnlineSoko Mbeya)</h1>
    <button onclick="logout()" style="width: auto; background: #c62828; padding: 6px 12px;">Logout</button>
  </div>
  
  <div id="auth-status" style="color: green; font-weight: bold; margin: 10px 0;">Inahakiki mamlaka ya Admin...</div>

  <div class="container" id="admin-content" style="display: none;">
    <!-- Inventory Panel -->
    <div class="panel">
      <h3>1. Ongeza Bidhaa Mpya</h3>
      <input type="text" id="p-name" placeholder="Jina la Bidhaa">
      <input type="number" id="p-price" placeholder="Bei ya Kawaida (TZS)">
      <input type="number" id="p-offer-price" placeholder="Bei ya Offer (Acha wazi kama hakuna)">
      <label style="font-size: 12px; font-weight: bold;">Picha ya Bidhaa:</label>
      <input type="file" id="p-image" accept="image/*">
      
      <button id="save-btn" onclick="addProduct()">Hifadhi Bidhaa</button>

      <hr>
      <h4>Bidhaa Zilizopo Sokoni</h4>
      <div id="products-list">Inapakia...</div>
    </div>

    <!-- Orders Panel -->
    <div class="panel">
      <h3>2. Oda Zinazoingia (Live Orders)</h3>
      <div id="orders-list">Inasubiri oda...</div>
    </div>
  </div>

  <!-- Leaflet & Firebase SDKs -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // CLOUDINARY SETTINGS
    const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/emakljnw/image/upload";
    const CLOUDINARY_PRESET = "sokoni mbeya";

    const firebaseConfig = {
  apiKey: "AIzaSyBlsEfZZg3N6P40yzDZVzT90xwK-zImd88",
  authDomain: "foodies-mbeya.firebaseapp.com",
  databaseURL: "https://foodies-mbeya-default-rtdb.firebaseio.com",
  projectId: "foodies-mbeya",
  storageBucket: "foodies-mbeya.firebasestorage.app",
  messagingSenderId: "1074962803699",
  appId: "1:1074962803699:web:2cc5432bc5098ce9970086",
  measurementId: "G-NRN58KSQ49"
};

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const auth = firebase.auth();

    const ADMIN_EMAIL = "soko@on.mby";

    function logout() {
      auth.signOut().then(() => { window.location.replace("index.html"); });
    }

    // VERIFY ADMIN
    auth.onAuthStateChanged(user => {
      if (user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        document.getElementById('auth-status').style.display = 'none';
        document.getElementById('admin-content').style.display = 'flex';
        initVendorPanel();
      } else {
        document.getElementById('auth-status').style.color = 'red';
        document.getElementById('auth-status').textContent = "Huna Mamlaka!";
        setTimeout(() => window.location.replace("user.html"), 1500);
      }
    });

    function initVendorPanel() {
      // 1. UPLOAD IMAGE TO CLOUDINARY & SAVE PRODUCT
      window.addProduct = async function() {
        const name = document.getElementById('p-name').value.trim();
        const price = document.getElementById('p-price').value;
        const offerPrice = document.getElementById('p-offer-price').value;
        const fileInput = document.getElementById('p-image');
        const saveBtn = document.getElementById('save-btn');

        if (!name || !price) return alert("Jaza angalau Jina na Bei ya Kawaida!");

        saveBtn.disabled = true;
        saveBtn.textContent = "Inapandisha picha Cloudinary...";

        let imageUrl = "";

        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const formData = new FormData();
          formData.append("file", file);
          formData.append("upload_preset", CLOUDINARY_PRESET);

          try {
            const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
            const data = await res.json();
            imageUrl = data.secure_url || "";
          } catch (e) {
            alert("Kosa la ku-upload picha Cloudinary: " + e.message);
            saveBtn.disabled = false;
            saveBtn.textContent = "Hifadhi Bidhaa";
            return;
          }
        }

        db.ref('products').push({
          name: name,
          price: parseInt(price),
          offerPrice: offerPrice ? parseInt(offerPrice) : null,
          imageUrl: imageUrl,
          updatedAt: new Date().toISOString()
        }).then(() => {
          document.getElementById('p-name').value = '';
          document.getElementById('p-price').value = '';
          document.getElementById('p-offer-price').value = '';
          fileInput.value = '';
          alert("Bidhaa imehifadhiwa kikamilifu!");
        }).finally(() => {
          saveBtn.disabled = false;
          saveBtn.textContent = "Hifadhi Bidhaa";
        });
      };

      // 2. READ PRODUCTS & EDIT/DELETE
      db.ref('products').on('value', snapshot => {
        const list = document.getElementById('products-list');
        list.innerHTML = '';
        const data = snapshot.val();
        if (!data) return list.innerHTML = '<p>Hakuna bidhaa sokoni.</p>';

        for (let id in data) {
          const p = data[id];
          const imgTag = p.imageUrl ? `<img src="${p.imageUrl}" class="p-img">` : `<div style="width:60px;height:60px;background:#ddd;border-radius:4px;">No Img</div>`;
          const priceDisplay = p.offerPrice 
            ? `<strike style="color:#888;">TZS ${p.price.toLocaleString()}</strike> <strong style="color:#e65100;">TZS ${p.offerPrice.toLocaleString()}</strong> <span class="badge-offer">OFFER</span>`
            : `<strong>TZS ${p.price.toLocaleString()}</strong>`;

          list.innerHTML += `
            <div class="p-item">
              <div style="display:flex; gap:10px; align-items:center;">
                ${imgTag}
                <div style="flex:1;">
                  <h4 style="margin:0;">${p.name}</h4>
                  <p style="margin:4px 0; font-size:13px;">${priceDisplay}</p>
                </div>
              </div>
              <div style="display:flex; gap:5px; margin-top:8px;">
                <button style="background:#0288d1; font-size:12px; padding:4px;" onclick="editProduct('${id}', '${p.name}', ${p.price}, ${p.offerPrice || 'null'})">Edit</button>
                <button style="background:#c62828; font-size:12px; padding:4px;" onclick="db.ref('products/${id}').remove()">Futa</button>
              </div>
            </div>
          `;
        }
      });

      // EDIT FUNCTION
      window.editProduct = function(id, oldName, oldPrice, oldOffer) {
        const newName = prompt("Badilisha Jina la Bidhaa:", oldName);
        if (!newName) return;
        const newPrice = prompt("Badilisha Bei ya Kawaida:", oldPrice);
        if (!newPrice) return;
        const newOffer = prompt("Badilisha Bei ya Offer (Acha wazi kufuta offer):", oldOffer !== null ? oldOffer : "");

        db.ref('products/' + id).update({
          name: newName,
          price: parseInt(newPrice),
          offerPrice: newOffer ? parseInt(newOffer) : null
        }).then(() => alert("Bidhaa imesasishwa!"));
      };

      // 3. READ LIVE ORDERS WITH LEAFLET MAP
      db.ref('orders').on('value', snapshot => {
        const list = document.getElementById('orders-list');
        list.innerHTML = '';
        const orders = snapshot.val();
        if (!orders) return list.innerHTML = '<p>Hakuna oda mpya.</p>';

        let count = 0;
        for (let id in orders) {
          count++;
          const o = orders[id];
          const mapId = `order-map-${count}`;

          // Format items list
          let itemsHtml = "<ul>";
          if (o.items && o.items.length > 0) {
            o.items.forEach(i => itemsHtml += `<li>${i.name} - TZS ${i.price.toLocaleString()}</li>`);
          }
          if (o.customItems && o.customItems.length > 0) {
            o.customItems.forEach(ci => itemsHtml += `<li style="color:#0288d1;"><strong>[Maalum]</strong> ${ci.name} - TZS ${ci.price.toLocaleString()}</li>`);
          }
          itemsHtml += "</ul>";

          list.innerHTML += `
            <div class="order-card">
              <h4 style="margin:0 0 5px 0;">Oda ya: ${o.customerName || 'Mteja'}</h4>
              <p style="margin:3px 0;"><strong>Simu:</strong> ${o.customerPhone || 'N/A'}</p>
              <p style="margin:3px 0;"><strong>Jumla Kuu:</strong> TZS ${parseInt(o.totalPrice || 0).toLocaleString()}</p>
              <div><strong>Vitu Vilivyoagizwa:</strong> ${itemsHtml}</div>
              
              <label><strong>Eneo la Mteja kwenye Ramani:</strong></label>
              <div id="${mapId}" class="order-map"></div>
              
              <a href="${o.mapLocation ? o.mapLocation.googleMapsUrl : '#'}" target="_blank" style="display:block; text-align:center; background:#2e7d32; color:white; padding:8px; border-radius:4px; text-decoration:none; font-weight:bold; margin-top:5px;">
                📍 Fungua Google Maps
              </a>
            </div>
          `;

          // Render Leaflet Map after DOM inserts
          setTimeout(() => {
            if (o.mapLocation && o.mapLocation.lat && o.mapLocation.lng) {
              const m = L.map(mapId).setView([o.mapLocation.lat, o.mapLocation.lng], 14);
              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
              L.marker([o.mapLocation.lat, o.mapLocation.lng]).addTo(m);
            }
          }, 300);
        }
      });
    }
  </script>
</body>
</html>
