<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnlineSoko Mbeya - Soko Mkononi</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background: #f4f7f6; }
    header { background: #2e7d32; color: white; padding: 15px; text-align: center; border-radius: 8px; position: relative; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 15px; }
    .card { background: white; padding: 10px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; }
    button { background: #2e7d32; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .cart, .tracking-box { background: white; padding: 15px; margin-top: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
    input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 4px; }
    #map { height: 280px; width: 100%; border-radius: 8px; margin: 10px 0; border: 2px solid #2e7d32; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; }
    .status-Pending { background: #e65100; }
    .status-Delivered { background: #2e7d32; }
    .status-Cancelled { background: #c62828; }

    /* Cart Editor Styling */
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #f9f9f9; border-radius: 6px; margin-bottom: 6px; border: 1px solid #eee; }
    .qty-btn { background: #0288d1; color: white; padding: 2px 8px; border-radius: 3px; font-size: 14px; margin: 0 4px; border: none; cursor: pointer; }
    .del-btn { background: #c62828; color: white; padding: 3px 8px; border-radius: 3px; font-size: 11px; border: none; cursor: pointer; margin-left: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>🛒 OnlineSoko Mbeya</h1>
    <button style="position: absolute; right: 10px; top: 15px; background: #c62828; font-size: 11px;" onclick="logout()">Logout</button>
  </header>

  <!-- USER ORDERS TRACKING -->
  <div class="tracking-box">
    <h3>📦 Hali ya Oda Zako (Order Tracking)</h3>
    <div id="user-orders-list">Inapakia oda yako...</div>
  </div>

  <h2>Bidhaa Zilizopo Sokoni</h2>
  <div id="products-list" class="grid"><p>Inapakia bidhaa...</p></div>

  <!-- Custom Items Form -->
  <div class="cart" style="background:#e8f5e9;">
    <h3>📝 Unataka Kitu Kisichopo Sokoni?</h3>
    <div style="display:flex; gap:10px;">
      <input type="text" id="custom-name" placeholder="Mfano: Mchele Kilo 5">
      <input type="number" id="custom-price" placeholder="Bei (TZS)">
    </div>
    <button type="button" style="background:#0288d1; margin-top:5px;" onclick="addCustomItem()">+ Ongeza Kwenye Oda</button>
  </div>

  <div class="cart">
    <h2>Kikapu Chako (<span id="cart-count">0</span>)</h2>
    
    <!-- Edit Cart Area -->
    <div id="cart-items"></div>
    
    <p style="font-size: 18px; margin-top: 15px;"><strong>Jumla Kuu: TZS <span id="cart-total">0</span></strong></p>
    
    <hr>
    <h3>Usafirishaji (Delivery Mbeya)</h3>
    <input type="text" id="customer-name" placeholder="Jina Yako Kamili">
    <input type="text" id="customer-phone" placeholder="Namba ya Simu (07XXXXXXXX)">
    
    <label><strong>Weka Pin ya Eneo Lako kwenye Ramani ya Satellite (Mbeya Only):</strong></label>
    <div id="map"></div>
    <button type="button" style="background: #0288d1; font-size: 12px; padding: 6px; width: 100%;" onclick="locateUser()">📍 Onyesha Eneo Langu (GPS)</button>

    <button style="background: #25D366; font-size: 16px; width: 100%; margin-top: 15px;" onclick="submitOrder()">Tuma Oda Sasa</button>
  </div>

  <!-- Leaflet & Firebase SDKs -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBlsEfZZg3N6P40yzDZVzT90xwK-zImd88",
      authDomain: "foodies-mbeya.firebaseapp.com",
      databaseURL: "https://foodies-mbeya-default-rtdb.firebaseio.com",
      projectId: "foodies-mbeya",
      storageBucket: "foodies-mbeya.firebasestorage.app",
      messagingSenderId: "1074962803699",
      appId: "1:1074962803699:web:2cc5432bc5098ce9970086",
      measurementId: "G-NRN58KSQ49"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let currentUser = null;

    auth.onAuthStateChanged(user => {
      if (!user) window.location.replace("index.html");
      else {
        currentUser = user;
        loadUserOrders();
      }
    });

    function logout() {
      auth.signOut().then(() => window.location.replace("index.html"));
    }

    // MAPBOX SETTINGS & BOUNDS FOR MBEYA
    const mapboxAccessToken = 'pk.eyJ1IjoiZmluY2hsZW9uYXJkIiwiYSI6ImNtdXNqbWpybzBsdWkyeHNkbjI4ZWZpN2gifQ.elQjZtJsfEglZTipbJRBNA';
    const mbeyaBounds = L.latLngBounds(
      L.latLng(-9.6000, 32.0000),
      L.latLng(-7.8000, 34.2000)
    );

    let cart = [];
    let customItems = [];
    let selectedLat = -8.9094, selectedLng = 33.4586;
    let map, marker;

    window.onload = function() {
      map = L.map('map', {
        center: [selectedLat, selectedLng],
        zoom: 13.5,
        minZoom: 10,
        maxBounds: mbeyaBounds,
        maxBoundsViscosity: 1.0
      });

      L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/tiles/{z}/{x}/{y}?access_token=${mapboxAccessToken}`, {
        attribution: '© Mapbox',
        tileSize: 512,
        zoomOffset: -1,
        maxZoom: 18
      }).addTo(map);

      marker = L.marker([selectedLat, selectedLng], { draggable: true }).addTo(map);
      marker.bindPopup("Sogeza marker kuweka eneo la delivery").openPopup();

      marker.on('dragend', () => {
        const pos = marker.getLatLng();
        selectedLat = pos.lat;
        selectedLng = pos.lng;
      });

      map.on('click', (e) => {
        marker.setLatLng(e.latlng);
        selectedLat = e.latlng.lat;
        selectedLng = e.latlng.lng;
      });
    };

    function locateUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(p => {
          const lat = p.coords.latitude;
          const lng = p.coords.longitude;

          if (mbeyaBounds.contains([lat, lng])) {
            selectedLat = lat;
            selectedLng = lng;
            map.setView([selectedLat, selectedLng], 16);
            marker.setLatLng([selectedLat, selectedLng]);
            marker.bindPopup("Eneo lako la GPS lilipatikana!").openPopup();
          } else {
            alert("GPS inaonyesha upo nje ya mipaka ya Mbeya! Tafadhali weka pin kwenye ramani mwenyewe.");
          }
        });
      }
    }

    function loadUserOrders() {
      db.ref('orders').on('value', snapshot => {
        const list = document.getElementById('user-orders-list');
        list.innerHTML = '';
        const orders = snapshot.val();
        let myOrdersCount = 0;

        for (let id in orders) {
          if (orders[id].userId === currentUser.uid) {
            myOrdersCount++;
            const o = orders[id];
            const status = o.status || 'Pending';
            list.innerHTML += `
              <div style="background:#f9f9f9; padding:8px; border-radius:4px; margin-bottom:6px; border-left:4px solid #2e7d32;">
                <div style="display:flex; justify-content:space-between;">
                  <strong>Oda TZS ${o.totalPrice.toLocaleString()}</strong>
                  <span class="badge status-${status}">${status}</span>
                </div>
                <small style="color:#666;">Tarehe: ${new Date(o.timestamp).toLocaleDateString()}</small>
              </div>
            `;
          }
        }

        if (myOrdersCount === 0) list.innerHTML = '<p style="font-size:13px; color:#666;">Hujatuma oda yoyote bado.</p>';
      });
    }

    // READ PRODUCTS
    db.ref('products').on('value', snapshot => {
      const list = document.getElementById('products-list');
      list.innerHTML = '';
      const data = snapshot.val();
      if (!data) return list.innerHTML = '<p>Hakuna bidhaa kwa sasa.</p>';

      for (let id in data) {
        const p = data[id];
        const finalPrice = p.offerPrice ? p.offerPrice : p.price;
        const imgTag = p.imageUrl ? `<img src="${p.imageUrl}">` : `<div style="height:100px;background:#eee;border-radius:4px;">No Img</div>`;

        list.innerHTML += `
          <div class="card">
            ${imgTag}
            <h4 style="margin:6px 0;">${p.name}</h4>
            <p style="margin:4px 0; color:#2e7d32;"><strong>TZS ${finalPrice.toLocaleString()}</strong></p>
            <button onclick="addToCart('${p.name}', ${finalPrice})">Kikapuni</button>
          </div>
        `;
      }
    });

    // ADD TO CART WITH QUANTITY
    function addToCart(name, unitPrice) {
      const existing = cart.find(i => i.name === name);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ name, unitPrice, qty: 1 });
      }
      renderCart();
    }

    function addCustomItem() {
      const name = document.getElementById('custom-name').value.trim();
      const price = document.getElementById('custom-price').value;
      if (!name || !price) return alert("Weka jina na bei!");

      customItems.push({ name, price: parseInt(price) });
      document.getElementById('custom-name').value = '';
      document.getElementById('custom-price').value = '';
      renderCart();
    }

    // CART EDITING FUNCTIONS
    window.changeQty = function(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      renderCart();
    };

    window.removeFromCart = function(index) {
      cart.splice(index, 1);
      renderCart();
    };

    window.removeCustomItem = function(index) {
      customItems.splice(index, 1);
      renderCart();
    };

    function renderCart() {
      const list = document.getElementById('cart-items');
      list.innerHTML = '';
      let total = 0;
      let itemCount = 0;

      if (cart.length === 0 && customItems.length === 0) {
        list.innerHTML = '<p style="font-size:13px; color:#888;">Kikapu chako kipo tupu.</p>';
      }

      cart.forEach((item, index) => {
        const itemTotal = item.unitPrice * item.qty;
        total += itemTotal;
        itemCount += item.qty;

        list.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br>
              <small>TZS ${item.unitPrice.toLocaleString()} × ${item.qty} = TZS ${itemTotal.toLocaleString()}</small>
            </div>
            <div>
              <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
              <span style="font-weight:bold; font-size:14px;">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
              <button class="del-btn" onclick="removeFromCart(${index})">Futa</button>
            </div>
          </div>
        `;
      });

      customItems.forEach((item, index) => {
        total += item.price;
        itemCount += 1;

        list.innerHTML += `
          <div class="cart-item" style="border-left:3px solid #0288d1;">
            <div>
              <strong style="color:#0288d1;">[Custom] ${item.name}</strong><br>
              <small>TZS ${item.price.toLocaleString()}</small>
            </div>
            <div>
              <button class="del-btn" onclick="removeCustomItem(${index})">Futa</button>
            </div>
          </div>
        `;
      });

      document.getElementById('cart-count').textContent = itemCount;
      document.getElementById('cart-total').textContent = total.toLocaleString();
    }

    function submitOrder() {
      const name = document.getElementById('customer-name').value.trim();
      const phone = document.getElementById('customer-phone').value.trim();
      if (!name || !phone) return alert("Jaza Jina na Simu!");
      if (cart.length === 0 && customItems.length === 0) return alert("Weka kitu kikapuni!");

      let total = 0;
      const formattedItems = cart.map(i => {
        total += i.unitPrice * i.qty;
        return { name: `${i.name} (x${i.qty})`, price: i.unitPrice * i.qty };
      });

      customItems.forEach(ci => total += ci.price);

      db.ref('orders').push({
        userId: currentUser.uid,
        customerName: name,
        customerPhone: phone,
        items: formattedItems,
        customItems: customItems,
        totalPrice: total,
        status: "Pending",
        mapLocation: {
          lat: selectedLat,
          lng: selectedLng,
          googleMapsUrl: `https://www.google.com/maps?q=${selectedLat},${selectedLng}`
        },
        timestamp: new Date().toISOString()
      }).then(() => {
        alert("Oda yako imetumwa kikamilifu!");
        cart = [];
        customItems = [];
        renderCart();
      });
    }
  </script>
</body>
</html>
